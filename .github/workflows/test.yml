name: Test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: src/Frontend/hrconnect-ui/package-lock.json }
      - run: dotnet test src/Backend/HRConnect.slnx
      - run: npm ci
        working-directory: src/Frontend/hrconnect-ui
      - run: npx playwright install --with-deps chromium
        working-directory: src/Frontend/hrconnect-ui
      - run: npm run test:e2e
        working-directory: src/Frontend/hrconnect-ui
